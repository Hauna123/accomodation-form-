<title>MCRT | Accommodation</title>

<meta
    name="description"
    content="MCRT Accommodation Portal"
/>

<style>
    :root {
        --primary: #1f6f68;
        --background: #f5f7f7;
        --white: #ffffff;
        --text: #263238;
        --border: #e2e8e8;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--background);
        color: var(--text);
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* Top navigation / branding */
    .topbar {
        height: 64px;
        flex: 0 0 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        position: relative;
        z-index: 10;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 15px;
    }

    .brand-text {
        display: flex;
        flex-direction: column;
    }

    .brand-name {
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.2;
    }

    .brand-subtitle {
        font-size: 11px;
        color: #718080;
        margin-top: 2px;
    }

    .page-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--primary);
    }

    /* Main iframe area */
    .content {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 14px;
        background: var(--background);
    }

    .iframe-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 14px;
        background: var(--white);
        border: 1px solid var(--border);
        box-shadow:
            0 8px 30px rgba(31, 111, 104, 0.08);
        position: relative;
    }

    iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        background: white;
    }

    /* Loading indicator */
    .loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: white;
        z-index: 2;
        transition: opacity 0.3s ease;
    }

    .loader.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #dcebea;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .loading-text {
        font-size: 13px;
        color: #718080;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* Fallback message */
    .fallback {
        display: none;
        position: absolute;
        inset: 0;
        background: white;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        z-index: 3;
    }

    .fallback-card {
        max-width: 420px;
    }

    .fallback h2 {
        margin-bottom: 10px;
        color: var(--text);
    }

    .fallback p {
        color: #687777;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .fallback a {
        display: inline-block;
        padding: 11px 20px;
        border-radius: 8px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        font-weight: 600;
    }

    /* Tablet */
    @media (max-width: 768px) {
        .topbar {
            height: 56px;
            flex-basis: 56px;
            padding: 0 14px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 13px;
        }

        .brand-name {
            font-size: 15px;
        }

        .brand-subtitle {
            display: none;
        }

        .page-title {
            font-size: 12px;
        }

        .content {
            padding: 8px;
        }

        .iframe-wrapper {
            border-radius: 10px;
        }
    }

    /* Mobile */
    @media (max-width: 480px) {
        .topbar {
            padding: 0 12px;
        }

        .page-title {
            display: none;
        }

        .content {
            padding: 0;
        }

        .iframe-wrapper {
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
    }
</style>
